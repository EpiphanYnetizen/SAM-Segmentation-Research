model_type: vit_b
checkpoint: checkpoints/sam_vit_b_01ec64.pth
device: cuda

data_dir: data/splits/train
out_dir: outputs/finetuned

lora:
  rank: 8
  alpha: 16
  dropout: 0.1
  # SAM ViT 的注意力层参数名是 qkv / proj（不是 query / value），
  # 写错时 peft 会直接报 Target modules not found。
  target_modules:
    - qkv
    - proj

training:
  epochs: 5
  batch_size: 1
  grad_accum: 4
  learning_rate: 3.0e-4
  seed: 42
