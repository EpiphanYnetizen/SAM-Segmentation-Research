[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sam-segmentation-research"
version = "0.1.0"
description = "Research Track No.2: does Segment Anything work on all cases?"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scikit-image>=0.21",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
include = ["evaluation*", "scripts*"]
